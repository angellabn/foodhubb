spring.application.name=foodhub
# Server port: Defaults to 8088 locally, or dynamically uses $PORT on cloud platforms (Render, Railway, Heroku)
server.port=${PORT:8088}

# Default DataSource: In-memory H2 database for instant, zero‑config startup
spring.datasource.url=jdbc:h2:mem:foodhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8088/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Optional MySQL Configuration (uncomment when MySQL server is running)
